# #:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "dep-isolation-test"
version = "0.1.0"
authors = ["itowlson <ivan.towlson@fermyon.com>"]
description = ""

[variables]
fie = { default = "plop" }

[[trigger.http]]
route = "/..."
component = "dep-isolation-test"

[component.dep-isolation-test]
source = "target/wasm32-wasip2/release/dep_isolation_test.wasm"
allowed_outbound_hosts = []
variables = {"spork" = "main comp haz {{ fie }}"} # for now
[component.dep-isolation-test.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
[component.dep-isolation-test.dependencies]
"impo:impo/i-love-kv@1.0.0" = { path = "./target/wasm32-wasip2/release/the_dep.wasm", capabilities = { files = [{ source = "depfiles", destination = "/" }], key_value_stores = ["fie"], sqlite_databases = ["default"], variables = {"fie" = "dep haz {{ fie }}" } } }
